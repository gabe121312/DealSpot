# One-click deploy to Render (https://render.com)
#
# Push this folder to GitHub, then Render → New → Blueprint → pick the repo.
# After deploy, add the VAPID_* and PUSH_PUBLIC_BASE_URL env vars listed in
# PUBLISH.md to enable real push notifications.

services:
  - type: web
    name: dealspot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PUSH_PUBLIC_BASE_URL
        sync: false   # set to https://YOUR-NAME.onrender.com in the dashboard
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ── Premium / payments (see PUBLISH.md) ──
      - key: PREMIUM_EARLY_MINUTES
        value: 8        # how long free users wait for new deals
      - key: PREMIUM_SECRET
        sync: false     # long random string — signs member tokens, never change it
      - key: STRIPE_SECRET_KEY
        sync: false     # sk_live_... from Stripe dashboard
      - key: STRIPE_PAYMENT_URL
        sync: false     # your Stripe Payment Link URL
      - key: PREMIUM_PRICE_LABEL
        sync: false     # e.g. "$2.99/month"
      - key: STRIPE_MANAGE_URL
        sync: false     # optional: Stripe customer portal link
      # ── Extras: affiliate, tips, weekly email digest ──
      - key: AMAZON_TAG
        sync: false     # your Amazon Associates tag, e.g. "dealspot-20"
      - key: EBAY_CAMPID
        sync: false     # optional eBay Partner Network campid
      - key: TIP_URL
        sync: false     # e.g. https://ko-fi.com/yourpage — shows a tip-jar button
      - key: RESEND_API_KEY
        sync: false     # free at resend.com — turns on weekly digest emails
      - key: DIGEST_FROM
        sync: false     # optional custom From: for digest emails
    healthCheckPath: /healthz
    autoDeploy: true
